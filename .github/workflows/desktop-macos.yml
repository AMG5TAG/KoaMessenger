name: Build macOS desktop app

# Builds the KoaMessenger Electron desktop shell into a macOS .dmg.
#
# Two ways to run it:
#
# 1. AUTOMATED RELEASE (recommended) — Actions tab → "Run workflow" → pick a
#    bump (patch/minor/major). CI bumps desktop/package.json on main, commits
#    "Release vX.Y.Z", creates+pushes the matching tag, then builds & publishes
#    the Release. You never edit the version by hand.
#
# 2. MANUAL TAG — `git tag v1.2.3 && git push origin v1.2.3` builds & publishes
#    a Release for that tag (no version bump; assumes package.json already
#    matches, e.g. for re-releasing).
#
# Either way the output is a UNIVERSAL .dmg (Apple Silicon + Intel) uploaded as
# a build artifact AND attached to the GitHub Release.
#
# Code-signing + notarization run automatically WHEN the Apple secrets are set
# (see the "Package universal .dmg" step). Without them the build is unsigned and
# macOS Gatekeeper blocks first launch — right-click the app → Open, or run
# `xattr -dr com.apple.quarantine /Applications/KoaMessenger.app`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for this release"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Never run two releases at once (a second would race on the main-branch push).
concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write # bump-commit + tag push to main, and creating the Release

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + persisted token so the bump commit/tag can be pushed.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      # Resolve the release version + tag for BOTH entry points:
      #  - workflow_dispatch: bump package.json on main, commit, tag, push.
      #  - tag push: just read the version out of the tag name.
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEW=$(npm --prefix desktop/koa-messenger-desktop version "${{ inputs.bump }}" \
              --no-git-tag-version | tail -n1)            # e.g. v0.1.2
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release ${NEW}" desktop/koa-messenger-desktop/package.json
            git tag "${NEW}"
            git push origin HEAD:main
            git push origin "${NEW}"
            echo "tag=${NEW}" >> "$GITHUB_OUTPUT"
            echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Focused install: only the desktop package and its workspace deps, so CI
      # doesn't have to build the entire web/app stack just to package the shell.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/koa-messenger-desktop...

      - name: Compile TypeScript -> dist/main.cjs
        run: pnpm --filter @workspace/koa-messenger-desktop run build

      - name: Package universal .dmg
        id: pkg
        # Signs + notarizes when the Apple secrets are configured, otherwise
        # builds UNSIGNED (Gatekeeper right-click-to-open). See repo secrets:
        #   MAC_CSC_LINK            base64 of the Developer ID Application .p12
        #   MAC_CSC_KEY_PASSWORD    password the .p12 was exported with
        #   APPLE_API_KEY_P8_BASE64 base64 of the App Store Connect API .p8 key
        #   APPLE_API_KEY_ID        the API key's Key ID
        #   APPLE_API_ISSUER        the API key's Issuer ID
        env:
          # electron-builder decodes a base64 .p12 passed directly in CSC_LINK
          # and imports it into a temporary keychain automatically.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          ARGS="--mac --universal --publish never -c.extraMetadata.version=${{ steps.ver.outputs.version }}"
          if [ -n "${CSC_LINK:-}" ] && [ -n "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            echo "Apple secrets present -> signing + notarizing"
            # @electron/notarize wants APPLE_API_KEY to be a path to the .p8 file.
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_api_key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/asc_api_key.p8"
            ARGS="$ARGS -c.mac.notarize=true"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Apple secrets -> building UNSIGNED"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          # shellcheck disable=SC2086
          pnpm --filter @workspace/koa-messenger-desktop exec electron-builder $ARGS

      # Fail loudly if a "signed" build didn't actually end up signed, notarized
      # and Gatekeeper-acceptable — so a broken .dmg never reaches a Release.
      # Skipped entirely for the unsigned fallback (nothing to verify).
      - name: Verify signature & notarization
        if: steps.pkg.outputs.signed == 'true'
        run: |
          set -euo pipefail
          RELEASE_DIR="desktop/koa-messenger-desktop/release"
          APP=$(find "$RELEASE_DIR" -maxdepth 3 -name "*.app" | head -n1)
          DMG=$(ls "$RELEASE_DIR"/*.dmg | head -n1)
          if [ -z "$APP" ] || [ -z "$DMG" ]; then
            echo "::error::Could not locate built .app or .dmg under $RELEASE_DIR"; exit 1
          fi
          echo "Verifying app: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -i "Authority=Developer ID Application"
          echo "Gatekeeper assessment (notarization ticket must be accepted):"
          spctl --assess --type execute --verbose=4 "$APP"
          echo "Validating stapled notarization ticket on the .dmg:"
          xcrun stapler validate "$DMG"
          echo "✅ Signed, notarized and Gatekeeper-accepted."

      - name: Upload .dmg as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoaMessenger-macos-dmg
          path: desktop/koa-messenger-desktop/release/*.dmg
          if-no-files-found: error

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.ver.outputs.tag }}"
          desktop/koa-messenger-desktop/release/*.dmg
          --repo "${{ github.repository }}"
          --title "${{ steps.ver.outputs.tag }}"
          --generate-notes
