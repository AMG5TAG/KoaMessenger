name: Build desktop apps

# Builds the KoaMessenger Electron desktop shell for macOS, Windows and Linux.
#
# Two ways to run it:
#
# 1. AUTOMATED RELEASE (recommended) — Actions tab → "Run workflow" → pick a
#    bump (patch/minor/major). CI bumps desktop/package.json on main, commits
#    "Release vX.Y.Z", creates+pushes the matching tag, builds both installers,
#    and publishes the Release. You never edit the version by hand.
#
# 2. MANUAL TAG — `git tag v1.2.3 && git push origin v1.2.3` builds & publishes
#    a Release for that tag (no version bump).
#
# Flow: `prepare` resolves the version and creates a DRAFT release, the
# per-platform build jobs build in parallel and upload their installers to that
# draft, then `publish` flips it public — so a half-built release never goes
# live. Outputs:
#   - macOS:   universal .dmg (Apple Silicon + Intel), signed + notarized when
#              the Apple secrets are set (see RELEASING.md), else unsigned.
#   - Windows: NSIS .exe installer (x64), unsigned (SmartScreen will warn on
#              first run until a code-signing cert is added).
#   - Linux:   AppImage (x64).
# Each job also uploads its electron-updater feed (latest*.yml + blockmaps).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for this release"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Never run two releases at once (a second would race on the main-branch push).
concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write # bump-commit + tag push to main, and creating the Release

jobs:
  # Resolve version (bump+tag on manual runs) and open a draft GitHub Release
  # that the per-platform build jobs upload their installers into.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + persisted token to push the bump/tag

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEW=$(npm --prefix desktop/koa-messenger-desktop version "${{ inputs.bump }}" \
              --no-git-tag-version | tail -n1)            # e.g. v0.1.3
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release ${NEW}" desktop/koa-messenger-desktop/package.json
            git tag "${NEW}"
            git push origin HEAD:main
            git push origin "${NEW}"
            echo "tag=${NEW}" >> "$GITHUB_OUTPUT"
            echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it as the draft."
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes \
              --draft
          fi

  build-mac:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/koa-messenger-desktop...

      - name: Compile TypeScript -> dist/main.cjs
        run: pnpm --filter @workspace/koa-messenger-desktop run build

      - name: Package universal .dmg
        id: pkg
        # Signs + notarizes when the Apple secrets are configured, otherwise
        # builds UNSIGNED (Gatekeeper right-click-to-open). See RELEASING.md:
        #   MAC_CSC_LINK            base64 of the Developer ID Application .p12
        #   MAC_CSC_KEY_PASSWORD    password the .p12 was exported with
        #   APPLE_API_KEY_P8_BASE64 base64 of the App Store Connect API .p8 key
        #   APPLE_API_KEY_ID        the API key's Key ID
        #   APPLE_API_ISSUER        the API key's Issuer ID
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          ARGS="--mac --universal --publish never -c.extraMetadata.version=${{ needs.prepare.outputs.version }}"
          if [ -n "${CSC_LINK:-}" ] && [ -n "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            echo "Apple secrets present -> signing + notarizing"
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_api_key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/asc_api_key.p8"
            ARGS="$ARGS -c.mac.notarize=true"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Apple secrets -> building UNSIGNED"
            # The step env above sets CSC_LINK to "" when the secret is unset;
            # electron-builder treats a defined-but-empty CSC_LINK as a cert
            # path and fails ("... not a file"). Unset so it's truly absent.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          # shellcheck disable=SC2086
          pnpm --filter @workspace/koa-messenger-desktop exec electron-builder $ARGS

      - name: Verify signature & notarization
        if: steps.pkg.outputs.signed == 'true'
        run: |
          set -euo pipefail
          RELEASE_DIR="desktop/koa-messenger-desktop/release"
          APP=$(find "$RELEASE_DIR" -maxdepth 3 -name "*.app" | head -n1)
          DMG=$(ls "$RELEASE_DIR"/*.dmg | head -n1)
          if [ -z "$APP" ] || [ -z "$DMG" ]; then
            echo "::error::Could not locate built .app or .dmg under $RELEASE_DIR"; exit 1
          fi
          echo "Verifying app: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -i "Authority=Developer ID Application"
          echo "Gatekeeper assessment (notarization ticket must be accepted):"
          spctl --assess --type execute --verbose=4 "$APP"
          echo "Validating stapled notarization ticket on the .dmg:"
          xcrun stapler validate "$DMG"
          echo "✅ Signed, notarized and Gatekeeper-accepted."

      - name: Upload macOS installer + update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd desktop/koa-messenger-desktop/release
          # .dmg = user download; .zip + latest-mac.yml + .blockmap = the
          # electron-updater feed (macOS updates from the zip, not the dmg).
          files=( *.dmg *.zip *.blockmap latest-mac.yml )
          [ -f latest-mac.yml ] || { echo "::error::latest-mac.yml missing — auto-update would break"; exit 1; }
          echo "Uploading: ${files[*]}"
          gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber

  build-windows:
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # bash on Windows so the scripts below behave identically
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/koa-messenger-desktop...

      - name: Compile TypeScript -> dist/main.cjs
        run: pnpm --filter @workspace/koa-messenger-desktop run build

      - name: Package NSIS installer (.exe)
        run: >-
          pnpm --filter @workspace/koa-messenger-desktop exec
          electron-builder --win --publish never
          -c.extraMetadata.version=${{ needs.prepare.outputs.version }}

      - name: Upload Windows installer + update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd desktop/koa-messenger-desktop/release
          # .exe = installer; latest.yml + .blockmap = the electron-updater feed.
          files=( *.exe *.blockmap latest.yml )
          [ -f latest.yml ] || { echo "::error::latest.yml missing — auto-update would break"; exit 1; }
          echo "Uploading: ${files[*]}"
          gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/koa-messenger-desktop...

      - name: Compile TypeScript -> dist/main.cjs
        run: pnpm --filter @workspace/koa-messenger-desktop run build

      - name: Package AppImage
        run: >-
          pnpm --filter @workspace/koa-messenger-desktop exec
          electron-builder --linux AppImage --publish never
          -c.extraMetadata.version=${{ needs.prepare.outputs.version }}

      - name: Upload Linux installer + update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd desktop/koa-messenger-desktop/release
          # .AppImage = installer; latest-linux.yml + .blockmap = updater feed.
          files=( *.AppImage *.blockmap latest-linux.yml )
          [ -f latest-linux.yml ] || { echo "::error::latest-linux.yml missing — auto-update would break"; exit 1; }
          echo "Uploading: ${files[*]}"
          gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber

  # All installers built and uploaded -> make the release public.
  publish:
    needs: [prepare, build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${{ needs.prepare.outputs.tag }}"
          --repo "${{ github.repository }}" --draft=false
